<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0A1E" />
      <stop offset="50%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0D0A1E" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Numerology 9-chamber Vedic Yantra Grid -->
  <g transform="translate(450, 90)">
    <rect x="0" y="0" width="300" height="300" fill="none" stroke="#F5A623" stroke-width="2.5" />
    <line x1="100" y1="0" x2="100" y2="300" stroke="#F5A623" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="200" y1="0" x2="200" y2="300" stroke="#F5A623" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="100" x2="300" y2="100" stroke="#F5A623" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="200" x2="300" y2="200" stroke="#F5A623" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Numbers -->
    <text x="50" y="65" font-family="serif" font-size="32" fill="#F5A623" text-anchor="middle" font-weight="bold">1</text>
    <text x="150" y="65" font-family="serif" font-size="32" fill="#FFFDF5" text-anchor="middle">2</text>
    <text x="250" y="65" font-family="serif" font-size="32" fill="#F5A623" text-anchor="middle">3</text>
    <text x="50" y="165" font-family="serif" font-size="32" fill="#FFFDF5" text-anchor="middle">4</text>
    <text x="150" y="165" font-family="serif" font-size="40" fill="#FF6B00" text-anchor="middle" font-weight="bold">5</text>
    <text x="250" y="165" font-family="serif" font-size="32" fill="#FFFDF5" text-anchor="middle">6</text>
    <text x="50" y="265" font-family="serif" font-size="32" fill="#F5A623" text-anchor="middle">7</text>
    <text x="150" y="265" font-family="serif" font-size="32" fill="#FFFDF5" text-anchor="middle">8</text>
    <text x="250" y="265" font-family="serif" font-size="32" fill="#F5A623" text-anchor="middle">9</text>
  </g>
  <text x="600" y="475" font-family="sans-serif" font-size="34" fill="#FFFDF5" text-anchor="middle" font-weight="bold">NUMEROLOGY BASICS: MULANK &amp; CAREER TIMING</text>
  <text x="600" y="515" font-family="sans-serif" font-size="20" fill="#D4A853" text-anchor="middle">Birth Numbers, Planetary Rulers &amp; Business Name Vibrations</text>
</svg>
